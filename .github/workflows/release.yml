name: Release

on:
  push:
    branches: [ main ]
  # escape hatch: re-run the publish leg manually when it failed after
  # release-please has already created the GitHub Releases and tags
  # (re-running the failed job would reuse the old workflow definition)
  workflow_dispatch:
    inputs:
      paths:
        description: 'Re-publish target paths as JSON array (e.g. ["packages/runtime"])'
        required: true

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push release PR branch, create GitHub Release/tag
      pull-requests: write   # create/update/label release PR
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Sync generated lockfiles on the release PR branch. The node-workspace
  # plugin updates the workspace entries in package-lock.json by itself
  # (despite googleapis/release-please#1993), so in practice this job covers
  # Cargo.lock and acts as a safety net — usually a no-op.
  # Note: this push does not trigger CI on the PR (GITHUB_TOKEN-created events
  # do not fire workflows), and release.yml itself only triggers on main push,
  # so no workflow loop occurs.
  sync-release-pr:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # deliberately no dependency caching in the release flow (cache poisoning mitigation)
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: wasm32-wasip1
      - run: npm install --package-lock-only --ignore-scripts
      - run: cargo update -p swc-plugin-power-assert
      - name: Commit sync if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json Cargo.lock
            git commit -m "chore: sync lockfiles for release"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: npm              # waits here until the required reviewer approves
    permissions:
      contents: read
      id-token: write        # OIDC token exchange (this job only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # default shallow fetch is fine: tests do not depend on git history
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # deliberately no dependency caching in the release flow (cache poisoning mitigation)
      - name: Install npm with trusted publishing support
        # exact-pinned on purpose; review manually when bumping
        run: npm install -g npm@11.15.0 # zizmor: ignore[adhoc-packages]
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: wasm32-wasip1
      - run: npm ci --ignore-scripts
      - run: npm run build:dist
      - run: npm run test:dist
      - name: Publish released packages
        env:
          PATHS_RELEASED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.paths || needs.release-please.outputs.paths_released }}
        run: |
          echo "$PATHS_RELEASED" | jq -r '.[]' | while read -r path; do
            echo "Publishing $path"
            npm publish --workspace "$path" --provenance --access public
          done
